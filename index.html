<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Pretendard 및 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-50 to-slate-300 p-3 text-slate-800 sm:p-5">
    <main class="w-full max-w-lg rounded-2xl bg-white p-5 shadow-xl sm:p-8">
        <header class="mb-6 text-center">
            <h1 class="mb-1 flex items-center justify-center gap-2 text-2xl font-bold text-slate-800">
                <i class="fa-solid fa-list-check text-indigo-600" aria-hidden="true"></i>
                My To-Do List
            </h1>
            <p id="current-date" class="text-sm text-slate-500"></p>
        </header>

        <!-- 할 일 입력 영역 -->
        <form id="todo-form" class="mb-5 flex gap-2">
            <input class="min-w-0 flex-1 rounded-lg border-2 border-slate-200 px-4 py-3 text-base outline-none transition focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100" type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요..." aria-label="새로운 할 일" autofocus>
            <button class="shrink-0 rounded-lg bg-indigo-600 px-4 font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300" type="submit" id="add-btn">
                <i class="fa-solid fa-plus" aria-hidden="true"></i> 추가
            </button>
        </form>

        <!-- 필터 탭 영역 -->
        <div class="mb-5 flex rounded-lg bg-slate-100 p-1" role="group" aria-label="할 일 필터">
            <button class="filter-btn flex-1 rounded-md bg-white px-2 py-2 text-sm font-medium text-slate-800 shadow-sm transition" type="button" data-filter="all" aria-pressed="true">전체</button>
            <button class="filter-btn flex-1 rounded-md px-2 py-2 text-sm font-medium text-slate-500 transition hover:text-slate-800" type="button" data-filter="active" aria-pressed="false">진행 중</button>
            <button class="filter-btn flex-1 rounded-md px-2 py-2 text-sm font-medium text-slate-500 transition hover:text-slate-800" type="button" data-filter="completed" aria-pressed="false">완료됨</button>
        </div>

        <!-- 할 일 목록 영역 -->
        <ul id="todo-list" class="mb-5 max-h-80 list-none overflow-y-auto pr-1" aria-live="polite">
            <!-- 자바스크립트로 동적 생성됩니다 -->
        </ul>

        <!-- 하단 정보 및 삭제 버튼 -->
        <div class="flex items-center justify-between gap-2 border-t border-slate-200 pt-4 text-sm text-slate-500">
            <span id="items-left">남은 할 일: 0개</span>
            <button class="rounded px-0 py-1 text-sm text-slate-500 transition hover:text-red-500 hover:underline focus:outline-none focus:ring-2 focus:ring-red-200" type="button" id="clear-completed-btn">완료된 항목 삭제</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
