<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <!-- Pretendard 및 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="todo-app card border-0 shadow-sm">
        <header>
            <h1><i class="fa-solid fa-list-check" aria-hidden="true"></i> My To-Do List</h1>
            <p id="current-date"></p>
        </header>

        <!-- 할 일 입력 영역 -->
        <form id="todo-form" class="todo-input-box">
            <input class="form-control" type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요..." aria-label="새로운 할 일" autofocus>
            <button class="btn btn-primary" type="submit" id="add-btn"><i class="fa-solid fa-plus" aria-hidden="true"></i> 추가</button>
        </form>

        <!-- 필터 탭 영역 -->
        <div class="filter-buttons btn-group w-100" role="group" aria-label="할 일 필터">
            <button class="btn filter-btn active" type="button" data-filter="all" aria-pressed="true">전체</button>
            <button class="btn filter-btn" type="button" data-filter="active" aria-pressed="false">진행 중</button>
            <button class="btn filter-btn" type="button" data-filter="completed" aria-pressed="false">완료됨</button>
        </div>

        <!-- 할 일 목록 영역 -->
        <ul id="todo-list" aria-live="polite">
            <!-- 자바스크립트로 동적 생성됩니다 -->
        </ul>

        <!-- 하단 정보 및 삭제 버튼 -->
        <div class="todo-footer">
            <span id="items-left">남은 할 일: 0개</span>
            <button class="btn btn-link" type="button" id="clear-completed-btn">완료된 항목 삭제</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
