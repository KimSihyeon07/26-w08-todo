<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Todo List</title>
    <link rel="stylesheet" href="style.css">
    <!-- 구글 폰트 및 아이콘 -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-list-check"></i> My To-Do List</h1>
            <p id="current-date">오늘의 날짜</p>
        </header>

        <!-- 할 일 입력 영역 -->
        <div class="todo-input-box">
            <input type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요..." autofocus>
            <button id="add-btn"><i class="fa-solid fa-plus"></i> 추가</button>
        </div>

        <!-- 필터 탭 영역 -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="active">진행 중</button>
            <button class="filter-btn" data-filter="completed">완료됨</button>
        </div>

        <!-- 할 일 목록 영역 -->
        <ul id="todo-list">
            <!-- 자바스크립트로 동적 생성됩니다 -->
        </ul>

        <!-- 하단 정보 및 삭제 버튼 -->
        <div class="todo-footer">
            <span id="items-left">남은 할 일: 0개</span>
            <button id="clear-completed-btn">완료된 항목 삭제</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
